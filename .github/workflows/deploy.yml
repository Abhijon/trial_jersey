name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - prod
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy to Dev EC2 (main)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Dev EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Navigate to application folder on EC2 (Update path if different on server)
            cd /home/ubuntu/trial_jersey 

            # 2. Fetch latest changes from main branch
            git pull origin main

            # 3. Rebuild and restart Docker containers
            docker compose up -d --build

  deploy-prod:
    name: Deploy to Prod EC2 (prod)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod'
    steps:
      - name: Deploy to Prod EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: ${{ secrets.EC2_USER_PROD }}
          key: ${{ secrets.EC2_SSH_KEY_PROD }}
          script: |
            # 1. Navigate to application folder on prod EC2
            cd /home/ubuntu/trial_jersey 

            # 2. Fetch latest changes from prod branch
            git pull origin prod

            # 3. Rebuild and restart Docker containers
            docker compose up -d --build
