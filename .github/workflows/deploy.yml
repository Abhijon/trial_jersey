name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - prod
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy to Dev EC2 (main)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Dev EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Navigate to application folder on EC2 (Update path if different on server)
            cd /home/ubuntu/trial_jersey 

            # 2. Fetch latest changes from main branch
            git pull origin main

            # 3. Rebuild and restart Docker containers
            docker compose up -d --build

  deploy-prod:
    name: Deploy to Prod EC2 (prod)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod'
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ secrets.AWS_REGION_PROD }}

      - name: Deploy to Prod EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID_PROD }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /root/trial_jersey",
              "git pull origin prod",
              "docker compose up -d --build"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for the command to complete (timeout 300s)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID_PROD }}" || true

          # Fetch command output
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID_PROD }}" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}"
